<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 11 - Light Bulb Order Form</title>
</head>
<body>
    <h2>Light Bulb Order Form</h2>

    <form action="order_total.php" method="post">
        <p>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required>
        </p>

        <p><strong>Select Light Bulbs:</strong></p>
        <label><input type="checkbox" name="bulbs[]" value="2.39|Four 25-watt light bulbs ($2.39)"> Four 25-watt light bulbs for $2.39</label><br>
        <label><input type="checkbox" name="bulbs[]" value="4.29|Eight 25-watt light bulbs ($4.29)"> Eight 25-watt light bulbs for $4.29</label><br>
        <label><input type="checkbox" name="bulbs[]" value="3.95|Four 25-watt long-life light bulbs ($3.95)"> Four 25-watt long-life light bulbs for $3.95</label><br>
        <label><input type="checkbox" name="bulbs[]" value="7.49|Eight 25-watt long-life light bulbs ($7.49)"> Eight 25-watt long-life light bulbs for $7.49</label>

        <p><strong>Credit Card:</strong></p>
        <label><input type="radio" name="card" value="Visa" required> Visa</label><br>
        <label><input type="radio" name="card" value="Master Card"> Master Card</label><br>
        <label><input type="radio" name="card" value="Discover"> Discover</label>

        <p><input type="submit" value="Calculate Total"></p>
    </form>

    <br><br><br>

    <a href="../../">Kembali ke Halaman Utama</a>
</body>
</html>
